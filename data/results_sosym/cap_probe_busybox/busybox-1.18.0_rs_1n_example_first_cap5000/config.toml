# Hand-made from the cap-1,000 sweep config: cap 5,000, fold 0 only.
# timeout_s raised to 16 h so the 6 h guard cannot fire and mark the fold
# incomparable. n_folds stays 3 so the split matches the cap-1,000 run.
[general]
seed = 42
output_dir = "SWEEP_ALWAYS_PASSES_-o"
verbose = false

[evaluation]
algorithm = "interactive"
n_folds = 3
solver_name = "glucose4"
solver_mode = "incremental"
shuffle_bias = true

[evaluation.interactive]
# max_queries is the stopping RULE: deterministic, machine-independent, reportable.
# timeout_s is an operational GUARD so one pathological fold cannot hold a window
# open. It records convergence_reason='timeout', distinct from 'max_queries'. If it
# ever fires, that fold's numbers are not comparable and the window report says so.
max_queries = 5000
timeout_s = 57600
query_mode = "example_first"

[[models]]
name = "busybox-1.18.0_rs_1n"
oracle = "data/fms/busybox-1.18.0.uvl"
bias = "data/bias/busybox-1.18.0-bias.json"
examples = "data/examples/busybox-1.18.0_rs_1n.json"
folds_path = "data/folds/busybox-1.18.0_rs_1n_folds.json"
