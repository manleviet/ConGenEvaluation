# Cross-tree constraint candidates
# Original cross-tree constraints from feature model:
#   (Constraint 0) OR[TimeAware][NOT[BatteryStatus][]]
#   (Constraint 1) OR[Authentication][NOT[SecureDatabase][]]
#   (Constraint 2) OR[Alerts][NOT[BatteryStatus][]]
#   (Constraint 3) OR[Authentication][NOT[AuthenticatedUser][]]
#   (Constraint 4) OR[FileStorage][NOT[TraceFile][]]
#   (Constraint 5) OR[Encryption][NOT[CypheredMessages][]]
#   (Constraint 6) OR[NOT[SimpleImplementationSLF4J][]][NOT[XML][]]
#   (Constraint 7) OR[Authentication][NOT[Privacy][]]
#   (Constraint 8) OR[Encryption][NOT[Confidentiality][]]
#
# cross_tree_mode: 'all' generates requires/excludes for all feature pairs
#                  'leaf' generates only between leaf features
#                  'extracted' generates only between features from CTCs
cross_tree_candidates:
  cross_tree_mode: extracted
  cross_tree_features:
    - Alerts
    - AuthenticatedUser
    - Authentication
    - BatteryStatus
    - Confidentiality
    - CypheredMessages
    - Encryption
    - FileStorage
    - Privacy
    - SecureDatabase
    - SimpleImplementationSLF4J
    - TimeAware
    - TraceFile
    - XML
