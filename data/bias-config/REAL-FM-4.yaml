# Original cross-tree constraints from feature model:
#   (Constraint 0) OR[NOT[Wishlist][]][Wishlistsaveaftersession]
#   (Constraint 1) OR[NOT[Registration][]][Wishlistsaveaftersession]
#   (Constraint 2) OR[NOT[Eletronicgoods][]][Size]
#   (Constraint 3) OR[NOT[Physicalgoods][]][Size]
#   (Constraint 4) OR[NOT[Eletronicgoods][]][Eletronicgoodsfulfillment]
#   (Constraint 5) OR[NOT[Userbehaviourtrackinginformation][]][Userbehaviourtracking]
#   (Constraint 6) OR[NOT[Quickcheckout][]][Quickcheckoutprofile]
#   (Constraint 7) OR[NOT[Customerpreferences][]][Preferences]
#   (Constraint 8) OR[NOT[Services][]][Servicesfulfillment]
#   (Constraint 9) OR[NOT[Physicalgoods][]][Physicalgoodsfulfillment]
#   (Constraint 10) OR[NOT[Wishlistcontent][]][Wishlist]
#   (Constraint 11) OR[NOT[Registeredcheckout][]][Registertobuy]
#   (Constraint 12) OR[NOT[Shippingoptions][]][Shipping1]
#   (Constraint 13) OR[NOT[Registeredcheckout][]][Registrationenforcement]
#   (Constraint 14) OR[OR[NOT[Previouslyvisitedpages][]][Locallyvisitedpages]][Externalreferringpages]
#   (Constraint 15) OR[NOT[Specialoffers][]][Discounts]
#   (Constraint 16) OR[NOT[Availability][]][Inventorytracking]
#   (Constraint 17) OR[NOT[Physicalgoods][]][Weight]
#   (Constraint 18) OR[NOT[Categorypage][]][Categories]
#   (Constraint 19) OR[NOT[Permissions][]][Registration]
#   (Constraint 20) OR[NOT[E_mailwishlist][]][Registration]
#
# cross_tree_mode: 'all' generates requires/excludes for all feature pairs
#                  'leaf' generates only between leaf features
#                  'extracted' generates only between features from CTCs
