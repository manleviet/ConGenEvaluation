# Rule-learner baselines (C4) over the SAME folds the acquisition sweep used.
# Run with: python -m apps.run_baselines apps/conf/run_baselines_config.toml -o <scratch>
#
# All 28 (KB, sampling) units that have an acquisition result. busybox RS(2n)/RS(3n)
# are absent on purpose: no acquisition run exists for them, and a baseline cell
# beside an absent ConGen cell is a comparison against nothing.
#
# Never aim -o at a committed tree. Run to scratch, inspect, then copy in.

[general]
seed = 42
output_dir = "data/results"
verbose = true

[evaluation]
solver_name = "glucose4"
learners = ["ripper", "cn2", "decision_tree"]

[[models]]
name = "REAL-FM-7_rs_1n"
oracle = "data/fms/REAL-FM-7.uvl"
bias = "data/bias/REAL-FM-7-bias.json"
examples = "data/examples/REAL-FM-7_rs_1n.json"
folds_path = "data/folds/REAL-FM-7_rs_1n_folds.json"
