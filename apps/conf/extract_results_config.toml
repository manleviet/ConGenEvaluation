# Extract Results Configuration
# Run with: python -m apps.extract_results apps/conf/extract_results_config.toml

[general]
# Directory containing CV result JSON files (*_cv_*.json)
results_dir = "data/results/congen"

# Directory to save generated tables (MD + LaTeX)
output_dir = "paper/tables"

# Solver mode: "incremental", "non-incremental", or "both"
mode = "both"
