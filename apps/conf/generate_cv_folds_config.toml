# CV Fold Generation Configuration
# Run with: python -m apps.generate_cv_folds apps/conf/generate_cv_folds_config.toml

[folds]
seed = 82
n_folds = 3
output_dir = "data/folds"

# =============================================================================
# Models — only name + examples needed for fold generation
# Sampling strategies: rs_1n, rs_2n, rs_3n, rs_m, 2cov, ff
# =============================================================================

# =============================================================================
# REAL-FM-7 (14 features, 80 valid configs)
# =============================================================================
[[models]]
name = "REAL-FM-7_rs_1n"
examples = "data/examples/REAL-FM-7_rs_1n.json"

[[models]]
name = "REAL-FM-7_rs_2n"
examples = "data/examples/REAL-FM-7_rs_2n.json"

[[models]]
name = "REAL-FM-7_rs_3n"
examples = "data/examples/REAL-FM-7_rs_3n.json"

[[models]]
name = "REAL-FM-7_rs_m"
examples = "data/examples/REAL-FM-7_rs_m.json"

[[models]]
name = "REAL-FM-7_2cov"
examples = "data/examples/REAL-FM-7_2cov.json"

[[models]]
name = "REAL-FM-7_ff"
examples = "data/examples/REAL-FM-7_ff.json"

