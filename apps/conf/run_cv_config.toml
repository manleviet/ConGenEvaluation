# Unified Cross-Validation Configuration
# Run with: python -m apps.run_cv apps/conf/run_cv_config.toml -v

[general]
seed = 42
output_dir = "data/results"
verbose = true

[evaluation]
# Algorithm: "congen" or "interactive"
algorithm = "congen"

# Number of folds for cross-validation
n_folds = 3

# Solver settings
solver_name = "glucose4"

# Solver modes: "all" (both), "incremental", or "non-incremental"
solver_mode = "incremental"

# Shuffle bias ordering per fold
shuffle_bias = true

# Interactive-specific settings (only used when algorithm = "interactive")
[evaluation.interactive]
max_queries = 1000  # Maximum number of membership queries
# Query generation mode for example-based learning:
#   "example_only" - only draw queries from example pool (stops when pool empty)
#   "example_first" - examples first, then SAT-generated queries from bias (up to max_queries)
query_mode = "example_first"

# =============================================================================
# Models to evaluate
# Sampling strategies: rs_1n, rs_2n, rs_3n, rs_m, 2cov, ff
# =============================================================================

