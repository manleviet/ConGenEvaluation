# Bias Config Generator Configuration
# Usage: python apps/generate_bias_config.py --config apps/conf/generate_bias_config.toml

# Global settings (apply to all models unless overridden)
output_dir = "data/bias-config"
cross_tree_mode = "all"  # "all" for all features, "leaf" for leaf features only
verbose = true

# List of feature models to process
# Each model requires 'fm_path'
# Optional per-model: 'output' (overrides output_dir), 'cross_tree_mode'

