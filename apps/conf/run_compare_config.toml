# KB Comparison Configuration
# Compare learned KBs against ground truth feature models.
# Run with: python -m apps.run_compare apps/conf/run_compare_config.toml -v

[general]
# Default output dir for eval JSON files (overridden by per-model kb_dir)
output_dir = "data/results"
verbose = true

[compare]
# Strategy: "all" (all 3), "description", "clause", or "semantic"
strategy = "all"

# =============================================================================
# Models to compare
# Each model needs: oracle (FM), bias (JSON), kb_dir (where KB files live)
# kb_dir is also where *_eval.json files will be saved
# =============================================================================

# =============================================================================
# REAL-FM-7 (14 features)
# =============================================================================
#[[models]]
#name = "REAL-FM-7"
#oracle = "data/fms/REAL-FM-7.uvl"
#bias = "data/bias/REAL-FM-7-bias.json"
#kb_dir = "data/results/congen"

[[models]]
name = "REAL-FM-7"
oracle = "data/fms/REAL-FM-7.uvl"
bias = "data/bias/REAL-FM-7-bias.json"
kb_dir = "data/results/interactive"
