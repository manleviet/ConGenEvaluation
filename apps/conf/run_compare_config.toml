# KB Comparison Configuration
# Compare learned KBs against ground truth feature models.
# Run with: python -m apps.run_compare apps/conf/run_compare_config.toml -v
#
# ⚠ kb_dir is BOTH the input and the output: run_compare writes each evaluation back
# into the file it read. That is what you want for your own run, and destructive for
# a committed tree. Every kb_dir below therefore names `scratch/`, which is where
# `python -m apps.run_cv <cell config> -o scratch` puts its results.

[general]
# Default output dir for eval JSON files (overridden by per-model kb_dir)
output_dir = "scratch"
verbose = true

[compare]
# Strategy: "all" (all 3), "description", "clause", or "semantic"
strategy = "all"

# =============================================================================
# Models to compare
# Each model needs: oracle (FM), bias (JSON), kb_dir (where KB files live)
# kb_dir is also where *_eval.json files will be saved
# =============================================================================

[[models]]
name = "REAL-FM-7"
oracle = "data/fms/REAL-FM-7.uvl"
bias = "data/bias/REAL-FM-7-bias.json"
kb_dir = "scratch/congen"

[[models]]
name = "fqa"
oracle = "data/fms/fqa.uvl"
bias = "data/bias/fqa-bias.json"
kb_dir = "scratch/congen"

[[models]]
name = "arcade-game"
oracle = "data/fms/arcade-game.uvl"
bias = "data/bias/arcade-game-bias.json"
kb_dir = "scratch/congen"

[[models]]
name = "REAL-FM-4"
oracle = "data/fms/REAL-FM-4.uvl"
bias = "data/bias/REAL-FM-4-bias.json"
kb_dir = "scratch/congen"

[[models]]
name = "busybox-1.18.0"
oracle = "data/fms/busybox-1.18.0.uvl"
bias = "data/bias/busybox-1.18.0-bias.json"
kb_dir = "scratch/congen"
